name: RelayZero CI & Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies & Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r track_2b/src/backend/requirements.txt
          pip install ruff bandit pypdf

      - name: Python Lint & Format Validation
        run: |
          ruff check track_2b/src/backend

      - name: Static Security Scan (Bandit)
        run: |
          bandit -r track_2b/src/backend -x track_2b/src/backend/tests

      - name: Run Backend Pytest & Coverage Gate (>=85%)
        run: |
          export PYTHONPATH=.
          pytest track_2b/src/backend/tests -v -o asyncio_mode=auto --cov=track_2b/src/backend --cov-report=term --cov-fail-under=85

      - name: Verify Physical Gold-Separation & Zero Leakage Invariants
        run: |
          python -c "
          import os, json
          # 1. Assert deprecated combined dataset is completely removed
          assert not os.path.exists('track_2b/data/evaluation_dataset.json'), 'Deprecated combined evaluation_dataset.json must NOT exist!'
          
          # 2. Assert evaluation_inputs.jsonl contains ZERO gold fields
          with open('track_2b/data/evaluation_inputs.jsonl', encoding='utf-8') as f:
              for line in f:
                  data = json.loads(line)
                  for forbidden in ['gold_claims', 'gold_contradictions', 'gold_missing_critical']:
                      assert forbidden not in data, f'Forbidden field {forbidden} found in inputs!'

          # 3. Assert evaluation_gold.jsonl exists
          assert os.path.exists('track_2b/data/evaluation_gold.jsonl'), 'evaluation_gold.jsonl must exist!'
          print('Physical gold-separation verified: zero gold fields in inputs, combined file absent.')
          "

      - name: Run Evaluation Benchmark
        run: |
          python track_2b/src/backend/evaluation_runner.py

      - name: Compile Technical Report PDF
        run: |
          python track_2b/generate_pdf.py

      - name: Validate PDF Page Count
        run: |
          python -c "
          import pypdf
          reader = pypdf.PdfReader('track_2b/RelayZero_Report.pdf')
          pages = len(reader.pages)
          print(f'Report pages: {pages}')
          assert 1 <= pages <= 6, f'Page count {pages} exceeds official 6-page limit!'
          "

      - name: Dataset Size Check (< 100 MB)
        run: |
          python -c "
          import os
          data_size = sum(os.path.getsize(os.path.join(r, f)) for r, d, files in os.walk('track_2b/data') for f in files)
          print(f'Total data footprint: {data_size / 1024:.2f} KB')
          assert data_size < 100 * 1024 * 1024, 'Data exceeds 100MB limit!'
          "

      - name: Prohibited Pattern & Hallucination Scan
        run: |
          python -c "
          import os
          banned = ['0.948', '0.936', '0.938', '1.2%', '328.4 ms', '412.5 ms', '88%']
          found = []
          for root, dirs, files in os.walk('track_2b'):
              if any(p in root for p in ['node_modules', '.git', '__pycache__', 'dist']):
                  continue
              for f in files:
                  if f.endswith(('.py', '.md', '.json')):
                      fp = os.path.join(root, f)
                      with open(fp, encoding='utf-8', errors='ignore') as s:
                          for line_no, line in enumerate(s, 1):
                              for b in banned:
                                  if b in line:
                                      found.append(f'{fp}:{line_no} [{b}]')
          assert not found, f'Prohibited patterns detected: {found}'
          print('Clean: Zero prohibited patterns found.')
          "

  frontend-and-e2e-quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: track_2b/src/frontend/package-lock.json

      - name: Set up Python for Backend API Service
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Frontend & Backend Dependencies
        run: |
          pip install -r track_2b/src/backend/requirements.txt
          cd track_2b/src/frontend
          npm ci

      - name: Lint Frontend (Oxlint)
        working-directory: track_2b/src/frontend
        run: npm run lint

      - name: Typecheck and Build Frontend
        working-directory: track_2b/src/frontend
        run: npm run build

      - name: Install Playwright Browsers
        working-directory: track_2b/src/frontend
        run: npx playwright install --with-deps chromium

      - name: Start Application Server & Execute E2E Suite
        run: |
          export PYTHONPATH=.
          export APP_MODE=fixture
          python -m uvicorn track_2b.src.backend.main:app --host 127.0.0.1 --port 8000 &
          sleep 3
          curl -f http://127.0.0.1:8000/api/health
          node track_2b/src/frontend/e2e_runner.mjs

  docker-and-runtime-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Container
        working-directory: track_2b
        run: docker compose build

      - name: Start Container
        working-directory: track_2b
        run: docker compose up -d

      - name: Verify Container Health Check
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8000/api/health | grep -q "status"; then
              echo "Container health check passed!"
              exit 0
            fi
            echo "Waiting for container..."
            sleep 1
          done
          echo "Healthcheck timed out!"
          docker logs relayzero-app
          exit 1

      - name: Execute Representative API Workflow
        run: |
          echo "1. Checking presets endpoint:"
          curl -f http://localhost:8000/api/presets
          echo -e "\n2. Triggering incident processing workflow via REST:"
          curl -f -X POST http://localhost:8000/api/incidents/INC-2026-CH-01/process
          echo -e "\n3. Triggering preset shortcut endpoint:"
          curl -f -X POST http://localhost:8000/api/process \
            -H "Content-Type: application/json" \
            -d '{"preset_id": "alpine_tunnel_smoke"}'

      - name: Shutdown Container
        working-directory: track_2b
        run: docker compose down
