name: RelayZero CI & Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r track_2b/src/backend/requirements.txt

      - name: Run Backend Pytest & Egress Zero Suite
        run: |
          export PYTHONPATH=.
          pytest track_2b/src/backend/tests -v -o asyncio_mode=auto --cov=track_2b/src/backend --cov-report=term

      - name: Run Evaluation Benchmark
        run: |
          python track_2b/src/backend/evaluation_runner.py

      - name: Compile Technical Report PDF
        run: |
          python track_2b/generate_pdf.py

  frontend-quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: track_2b/src/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: track_2b/src/frontend
        run: npm ci

      - name: Typecheck and Build Frontend
        working-directory: track_2b/src/frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        working-directory: track_2b
        run: docker compose build
